name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check server.js && node --check src/app.js

      - name: Build Docker image
        run: docker build -t taskboard-backend .

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect taskboard-backend --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 200 ]; then
            echo "ERROR: Image size exceeds 200MB limit"
            exit 1
          fi
          echo "Image size is within 200MB limit"
